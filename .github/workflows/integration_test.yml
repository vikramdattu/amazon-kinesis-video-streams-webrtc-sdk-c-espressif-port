name: Integration Tests

# Linux loopback (master + viewer over real KVS) and an esp32s3 build
# smoke that exercises the SDK component graph against a stock ESP-IDF
# release. Both run on every push and PR; the Linux loopback gates on
# AWS creds being present in repo secrets — it skips itself otherwise so
# fork PRs don't fail.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
  pull_request:
    branches: [main]

jobs:
  linux_loopback:
    name: "Linux loopback | KVS master+viewer"
    runs-on: ubuntu-22.04
    # Disabled while focus is on the QEMU+Python viewer integration
    # test. The docker-compose-based loopback (master+viewer in
    # containers on the host runner) needs separate stabilisation.
    # Re-enable by removing `if: false`.
    if: false
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify AWS creds are wired up
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::warning::AWS_ACCESS_KEY_ID secret not set — skipping integration test."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"
        id: creds

      - name: Materialise .env from repo secrets
        if: steps.creds.outputs.skip != '1'
        run: |
          cat > tests/docker/.env <<EOF
          AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION || 'us-west-2' }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }}
          KVS_CHANNEL_NAME=${{ secrets.KVS_CHANNEL_NAME || format('espressif-port-ci-{0}', github.run_id) }}
          TEST_DURATION_SEC=45
          AWS_KVS_LOG_LEVEL=3
          EOF

      - name: Run docker-compose integration test
        if: steps.creds.outputs.skip != '1'
        run: ./tests/docker/run_test.sh

      - name: Upload logs
        if: always() && steps.creds.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-${{ github.run_id }}
          path: tests/docker/out/
          retention-days: 7

  python_loopback:
    name: "Linux loopback | aiortc Python viewer + ffprobe"
    runs-on: ubuntu-22.04
    # Disabled — same reason as linux_loopback above. The QEMU job
    # already exercises the python_viewer side end-to-end against
    # the SDK we ship.
    if: false
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify AWS creds
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        id: creds
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::warning::AWS_ACCESS_KEY_ID secret not set — skipping python integration test."
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"

      - name: Materialise .env
        if: steps.creds.outputs.skip != '1'
        run: |
          # Distinct channel name from the C-viewer job to avoid collisions
          # if both run concurrently.
          cat > tests/docker/.env <<EOF
          AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION || 'us-west-2' }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }}
          KVS_CHANNEL_NAME=${{ secrets.KVS_CHANNEL_NAME || format('espressif-port-ci-py-{0}', github.run_id) }}
          TEST_DURATION_SEC=45
          AWS_KVS_LOG_LEVEL=3
          EOF

      - name: Run python-viewer test
        if: steps.creds.outputs.skip != '1'
        run: ./tests/docker/run_test.sh --python

      - name: Upload artifacts (logs + MKV)
        if: always() && steps.creds.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: python-viewer-${{ github.run_id }}
          path: tests/docker/out/
          retention-days: 7

  esp32s3_build_smoke:
    name: "esp32s3 build smoke | webrtc_classic"
    runs-on: ubuntu-22.04
    container: espressif/idf:release-v5.5
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply SDK patches
        shell: bash
        run: |
          git config --global --add safe.directory "*"
          cd amazon-kinesis-video-streams-webrtc-sdk-c
          git config user.email "ci@example.com"
          git config user.name "CI"
          git am ../patches/*.patch

      - name: Build webrtc_classic for esp32s3
        env:
          KVS_SDK_PATH: ${{ github.workspace }}
        shell: bash
        run: |
          cd examples/webrtc_classic
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Build linux_test canary
        shell: bash
        # The Linux IDF target build of the SDK isn't green yet — three
        # undefined symbols at link (lws_open, esp_timer_get_time,
        # flash_wrapper_init). Tracked in Athena. Keep the configure
        # step here so we catch CMakeLists / idf_component.yml drift,
        # but don't gate the job on the build succeeding.
        continue-on-error: true
        run: |
          cd examples/linux_test
          . /opt/esp/idf/export.sh
          idf.py --preview set-target linux
          idf.py build || echo "::warning::linux_test build still has undefined symbols; tracked separately"

  esp32s3_qemu_kvs_test:
    name: "esp32s3 QEMU + Python viewer | webrtc_classic"
    runs-on: ubuntu-22.04
    container: espressif/idf:release-v5.5
    # Skip on forks: AWS_* secrets aren't available in PRs from forks.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request' }}
    timeout-minutes: 45

    env:
      # Per-run KVS channel; deleted at end of job. Different prefix
      # from the linux_loopback / python_loopback jobs so concurrent
      # runs don't collide.
      KVS_CHANNEL_NAME: ${{ secrets.KVS_QEMU_CHANNEL_NAME || format('espressif-port-qemu-{0}', github.run_id) }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-west-2' }}
      TEST_DURATION_SEC: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify AWS creds
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        id: creds
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::warning::AWS_ACCESS_KEY_ID not set — skipping QEMU integration test."
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"

      - name: Apply SDK patches
        shell: bash
        run: |
          git config --global --add safe.directory "*"
          cd amazon-kinesis-video-streams-webrtc-sdk-c
          git config user.email "ci@example.com"
          git config user.name "CI"
          git am ../patches/*.patch

      - name: Install qemu-xtensa + Python viewer deps + ffmpeg
        if: steps.creds.outputs.skip != '1'
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa
          which qemu-system-xtensa
          # ffmpeg gives us ffprobe for the recording-verification step.
          # libvpx / libsrtp / libopus / awscli aren't reliably present
          # in the espressif/idf image's apt sources, so we lean on
          # pip + boto3 instead — the python_viewer requirements file
          # already brings boto3 along with aiortc/PyAV (which bundles
          # the codec libs).
          apt-get update && apt-get install -y --no-install-recommends ffmpeg
          pip install --no-cache-dir -r tests/docker/python_viewer/requirements.txt

      - name: Generate sdkconfig overlay with AWS creds
        if: steps.creds.outputs.skip != '1'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        shell: bash
        run: tests/docker/ci/gen_creds_overlay.sh examples/webrtc_classic/sdkconfig.defaults.qemu.local

      - name: Build webrtc_classic for esp32s3 with QEMU + creds overlays
        if: steps.creds.outputs.skip != '1'
        env:
          KVS_SDK_PATH: ${{ github.workspace }}
          SDKCONFIG_DEFAULTS: "sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.defaults.qemu;sdkconfig.defaults.qemu.local"
        shell: bash
        run: |
          cd examples/webrtc_classic
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Run QEMU + Python viewer against same KVS channel
        if: steps.creds.outputs.skip != '1'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        shell: bash
        run: |
          # `-global driver=ssi_psram,property=size_mbytes,value=8`
          # caps emulated PSRAM at 8 MB (matches real S3-WROOM-1U-N16R8).
          # The qemu-xtensa esp_develop_9.2.2 build silently ignores
          # this global today (tracked: gitlab idf/qemu MR !115); the
          # firmware overlay disables PSRAM as a workaround.
          export OUT_PATH="$GITHUB_WORKSPACE/qemu_recording.mkv"
          export LOG_PATH="$GITHUB_WORKSPACE/python_viewer.log"
          cd examples/webrtc_classic
          . /opt/esp/idf/export.sh
          "$GITHUB_WORKSPACE/tests/docker/ci/run_qemu_with_viewer.sh" \
              "-global driver=ssi_psram,property=size_mbytes,value=8"

      - name: Verify recording (ffprobe — H.264 + OPUS cross-check)
        if: steps.creds.outputs.skip != '1'
        shell: bash
        run: tests/docker/ci/verify_recording.sh "$GITHUB_WORKSPACE/qemu_recording.mkv"

      - name: Delete KVS channel
        if: always() && steps.creds.outputs.skip != '1'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        shell: bash
        run: |
          # boto3 lives in the IDF python env (installed by python_viewer's
          # requirements.txt); source IDF env so it's on PATH.
          . /opt/esp/idf/export.sh
          python tests/docker/ci/kvs_delete_channel.py

      - name: Upload QEMU + viewer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-kvs-test-${{ github.run_id }}
          path: |
            examples/webrtc_classic/qemu_serial.log
            python_viewer.log
            qemu_recording.mkv
            ffprobe.txt
          retention-days: 7

  # ESP32 (xtensa, original) variant of the QEMU integration test.
  # Runs in parallel with esp32s3_qemu_kvs_test against a separate
  # KVS channel.
  #
  # Why we have an ESP32 path at all: the ssi_psram device shipped with
  # qemu-xtensa esp_develop_9.2.2 silently ignores
  # `-global driver=ssi_psram,property=size_mbytes,value=N` (machine
  # init clobbers the property right after qdev_new). The ESP32-S3
  # workflow above wants 8 MB PSRAM and gets 32 MB instead, which
  # exhausts the cache MMU's vaddr range. ESP32's default emulated
  # PSRAM is 4 MB, which matches what real ESP32-WROVER hardware ships
  # with — so this job exercises the full end-to-end path on the
  # unpatched QEMU we already have. Tracked upstream MR:
  # https://gitlab.espressif.cn:6688/idf/qemu/-/merge_requests/115
  esp32_qemu_kvs_test:
    name: "esp32 QEMU + Python viewer | webrtc_classic"
    runs-on: ubuntu-22.04
    container: espressif/idf:release-v5.5
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request' }}
    timeout-minutes: 45

    env:
      KVS_CHANNEL_NAME: ${{ secrets.KVS_QEMU_CHANNEL_NAME && format('{0}-esp32', secrets.KVS_QEMU_CHANNEL_NAME) || format('espressif-port-qemu-esp32-{0}', github.run_id) }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-west-2' }}
      TEST_DURATION_SEC: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify AWS creds
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        id: creds
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::warning::AWS_ACCESS_KEY_ID not set — skipping QEMU integration test."
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"

      - name: Apply SDK patches
        shell: bash
        run: |
          git config --global --add safe.directory "*"
          cd amazon-kinesis-video-streams-webrtc-sdk-c
          git config user.email "ci@example.com"
          git config user.name "CI"
          git am ../patches/*.patch

      - name: Install qemu-xtensa + Python viewer deps + ffmpeg
        if: steps.creds.outputs.skip != '1'
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa
          which qemu-system-xtensa
          apt-get update && apt-get install -y --no-install-recommends ffmpeg
          pip install --no-cache-dir -r tests/docker/python_viewer/requirements.txt

      - name: Generate sdkconfig overlay with AWS creds
        if: steps.creds.outputs.skip != '1'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        shell: bash
        run: tests/docker/ci/gen_creds_overlay.sh examples/webrtc_classic/sdkconfig.defaults.qemu.local

      - name: Build webrtc_classic for esp32 with QEMU + creds overlays
        if: steps.creds.outputs.skip != '1'
        env:
          KVS_SDK_PATH: ${{ github.workspace }}
          # No esp32-specific overlay — the base sdkconfig.defaults
          # already sets CONFIG_ESP32_SPIRAM_SUPPORT=y + 4 MB QSPI
          # PSRAM defaults that line up with what qemu-xtensa emulates
          # out of the box (`-M esp32 -m 4M`).
          SDKCONFIG_DEFAULTS: "sdkconfig.defaults;sdkconfig.defaults.qemu;sdkconfig.defaults.qemu.local"
        shell: bash
        run: |
          cd examples/webrtc_classic
          . /opt/esp/idf/export.sh
          idf.py set-target esp32
          idf.py build

      - name: Run QEMU + Python viewer against same KVS channel
        if: steps.creds.outputs.skip != '1'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        shell: bash
        run: |
          # No size_mbytes override here — esp32's machine default is
          # already `-m 4M` and qemu's ssi_psram device defaults to 4
          # MB, which matches what real ESP32-WROVER hardware reports.
          export OUT_PATH="$GITHUB_WORKSPACE/qemu_recording.mkv"
          export LOG_PATH="$GITHUB_WORKSPACE/python_viewer.log"
          cd examples/webrtc_classic
          . /opt/esp/idf/export.sh
          "$GITHUB_WORKSPACE/tests/docker/ci/run_qemu_with_viewer.sh"

      - name: Verify recording (ffprobe — H.264 + OPUS cross-check)
        if: steps.creds.outputs.skip != '1'
        shell: bash
        run: tests/docker/ci/verify_recording.sh "$GITHUB_WORKSPACE/qemu_recording.mkv"

      - name: Delete KVS channel
        if: always() && steps.creds.outputs.skip != '1'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          python tests/docker/ci/kvs_delete_channel.py

      - name: Upload QEMU + viewer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-esp32-kvs-test-${{ github.run_id }}
          path: |
            examples/webrtc_classic/qemu_serial.log
            python_viewer.log
            qemu_recording.mkv
            ffprobe.txt
          retention-days: 7

  # IDF Linux-target variant: drives the same SDK stack
  # (app_webrtc + kvs_signaling + kvs_webrtc) as a master peer
  # entirely on the runner host — no QEMU, no slirp NAT. Sidesteps
  # every QEMU networking limitation that blocks media flow on the
  # esp32 / esp32s3 jobs above.
  linux_test_kvs:
    name: "linux_test (IDF Linux target) | KVS master"
    runs-on: ubuntu-22.04
    container: espressif/idf:release-v5.5
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request' }}
    timeout-minutes: 30

    env:
      KVS_CHANNEL_NAME: ${{ secrets.KVS_QEMU_CHANNEL_NAME && format('{0}-linux', secrets.KVS_QEMU_CHANNEL_NAME) || format('espressif-port-linux-{0}', github.run_id) }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-west-2' }}
      TEST_DURATION_SEC: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify AWS creds
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        id: creds
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::warning::AWS_ACCESS_KEY_ID not set — skipping linux_test integration test."
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"

      - name: Apply SDK patches
        shell: bash
        run: |
          git config --global --add safe.directory "*"
          cd amazon-kinesis-video-streams-webrtc-sdk-c
          git config user.email "ci@example.com"
          git config user.name "CI"
          git am ../patches/*.patch

      - name: Install Python viewer deps + ffmpeg
        if: steps.creds.outputs.skip != '1'
        shell: bash
        run: |
          # `pip` is only on PATH after the IDF env is sourced
          # (espressif/idf base image puts it under
          # /opt/esp/python_env/...). Same pattern as the QEMU jobs.
          . /opt/esp/idf/export.sh
          apt-get update && apt-get install -y --no-install-recommends ffmpeg
          pip install --no-cache-dir -r tests/docker/python_viewer/requirements.txt

      - name: Build linux_test (IDF Linux target)
        if: steps.creds.outputs.skip != '1'
        env:
          KVS_SDK_PATH: ${{ github.workspace }}
        shell: bash
        run: |
          cd examples/linux_test
          . /opt/esp/idf/export.sh
          idf.py --preview set-target linux
          idf.py build

      - name: Run linux_test master + Python viewer
        if: steps.creds.outputs.skip != '1'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        shell: bash
        run: |
          export OUT_PATH="$GITHUB_WORKSPACE/linux_recording.mkv"
          export LOG_PATH="$GITHUB_WORKSPACE/python_viewer.log"
          export KVS_FRAMES_DIR="$GITHUB_WORKSPACE/amazon-kinesis-video-streams-webrtc-sdk-c/samples"
          cd examples/linux_test
          . /opt/esp/idf/export.sh
          "$GITHUB_WORKSPACE/tests/docker/ci/run_linux_with_viewer.sh"

      - name: Verify recording (ffprobe — H.264 + OPUS cross-check)
        if: steps.creds.outputs.skip != '1'
        shell: bash
        run: tests/docker/ci/verify_recording.sh "$GITHUB_WORKSPACE/linux_recording.mkv"

      - name: Delete KVS channel
        if: always() && steps.creds.outputs.skip != '1'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          python tests/docker/ci/kvs_delete_channel.py

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-test-kvs-${{ github.run_id }}
          path: |
            examples/linux_test/linux_master.log
            python_viewer.log
            linux_recording.mkv
            ffprobe.txt
          retention-days: 7
