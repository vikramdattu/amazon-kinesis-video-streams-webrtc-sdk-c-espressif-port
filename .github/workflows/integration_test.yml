name: Integration Tests

# Linux loopback (master + viewer over real KVS) and an esp32s3 build
# smoke that exercises the SDK component graph against a stock ESP-IDF
# release. Both run on every push and PR; the Linux loopback gates on
# AWS creds being present in repo secrets — it skips itself otherwise so
# fork PRs don't fail.

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - 'feat/**'
      - 'feature/**'
  pull_request:
    branches: [main]

jobs:
  linux_loopback:
    name: "Linux loopback | KVS master+viewer"
    runs-on: ubuntu-22.04
    # Disabled while focus is on the QEMU+Python viewer integration
    # test. The docker-compose-based loopback (master+viewer in
    # containers on the host runner) needs separate stabilisation.
    # Re-enable by removing `if: false`.
    if: false
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify AWS creds are wired up
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::warning::AWS_ACCESS_KEY_ID secret not set — skipping integration test."
            echo "skip=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"
        id: creds

      - name: Materialise .env from repo secrets
        if: steps.creds.outputs.skip != '1'
        run: |
          cat > tests/docker/.env <<EOF
          AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION || 'us-west-2' }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }}
          KVS_CHANNEL_NAME=${{ secrets.KVS_CHANNEL_NAME || format('espressif-port-ci-{0}', github.run_id) }}
          TEST_DURATION_SEC=45
          AWS_KVS_LOG_LEVEL=3
          EOF

      - name: Run docker-compose integration test
        if: steps.creds.outputs.skip != '1'
        run: ./tests/docker/run_test.sh

      - name: Upload logs
        if: always() && steps.creds.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: integration-logs-${{ github.run_id }}
          path: tests/docker/out/
          retention-days: 7

  python_loopback:
    name: "Linux loopback | aiortc Python viewer + ffprobe"
    runs-on: ubuntu-22.04
    # Disabled — same reason as linux_loopback above. The QEMU job
    # already exercises the python_viewer side end-to-end against
    # the SDK we ship.
    if: false
    continue-on-error: true
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify AWS creds
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        id: creds
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::warning::AWS_ACCESS_KEY_ID secret not set — skipping python integration test."
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"

      - name: Materialise .env
        if: steps.creds.outputs.skip != '1'
        run: |
          # Distinct channel name from the C-viewer job to avoid collisions
          # if both run concurrently.
          cat > tests/docker/.env <<EOF
          AWS_DEFAULT_REGION=${{ secrets.AWS_DEFAULT_REGION || 'us-west-2' }}
          AWS_ACCESS_KEY_ID=${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY=${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN=${{ secrets.AWS_SESSION_TOKEN }}
          KVS_CHANNEL_NAME=${{ secrets.KVS_CHANNEL_NAME || format('espressif-port-ci-py-{0}', github.run_id) }}
          TEST_DURATION_SEC=45
          AWS_KVS_LOG_LEVEL=3
          EOF

      - name: Run python-viewer test
        if: steps.creds.outputs.skip != '1'
        run: ./tests/docker/run_test.sh --python

      - name: Upload artifacts (logs + MKV)
        if: always() && steps.creds.outputs.skip != '1'
        uses: actions/upload-artifact@v4
        with:
          name: python-viewer-${{ github.run_id }}
          path: tests/docker/out/
          retention-days: 7

  esp32s3_build_smoke:
    name: "esp32s3 build smoke | webrtc_classic"
    runs-on: ubuntu-22.04
    container: espressif/idf:release-v5.5
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Apply SDK patches
        shell: bash
        run: |
          git config --global --add safe.directory "*"
          cd amazon-kinesis-video-streams-webrtc-sdk-c
          git config user.email "ci@example.com"
          git config user.name "CI"
          git am ../patches/*.patch

      - name: Build webrtc_classic for esp32s3
        env:
          KVS_SDK_PATH: ${{ github.workspace }}
        shell: bash
        run: |
          cd examples/webrtc_classic
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Build linux_test canary
        shell: bash
        # The Linux IDF target build of the SDK isn't green yet — three
        # undefined symbols at link (lws_open, esp_timer_get_time,
        # flash_wrapper_init). Tracked in Athena. Keep the configure
        # step here so we catch CMakeLists / idf_component.yml drift,
        # but don't gate the job on the build succeeding.
        continue-on-error: true
        run: |
          cd examples/linux_test
          . /opt/esp/idf/export.sh
          idf.py --preview set-target linux
          idf.py build || echo "::warning::linux_test build still has undefined symbols; tracked separately"

  esp32s3_qemu_kvs_test:
    name: "esp32s3 QEMU + Python viewer | webrtc_classic"
    runs-on: ubuntu-22.04
    container: espressif/idf:release-v5.5
    # Skip on forks: AWS_* secrets aren't available in PRs from forks.
    if: ${{ github.event.pull_request.head.repo.full_name == github.repository || github.event_name != 'pull_request' }}
    timeout-minutes: 45

    env:
      # Per-run KVS channel; deleted at end of job. Different prefix
      # from the linux_loopback / python_loopback jobs so concurrent
      # runs don't collide.
      KVS_CHANNEL_NAME: ${{ secrets.KVS_QEMU_CHANNEL_NAME || format('espressif-port-qemu-{0}', github.run_id) }}
      AWS_DEFAULT_REGION: ${{ secrets.AWS_DEFAULT_REGION || 'us-west-2' }}
      TEST_DURATION_SEC: 60

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify AWS creds
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
        id: creds
        run: |
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "::warning::AWS_ACCESS_KEY_ID not set — skipping QEMU integration test."
            echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          echo "skip=0" >> "$GITHUB_OUTPUT"

      - name: Apply SDK patches
        shell: bash
        run: |
          git config --global --add safe.directory "*"
          cd amazon-kinesis-video-streams-webrtc-sdk-c
          git config user.email "ci@example.com"
          git config user.name "CI"
          git am ../patches/*.patch

      - name: Install qemu-xtensa + Python viewer deps + ffmpeg
        if: steps.creds.outputs.skip != '1'
        shell: bash
        run: |
          . /opt/esp/idf/export.sh
          python "$IDF_PATH/tools/idf_tools.py" install qemu-xtensa
          which qemu-system-xtensa
          # ffmpeg gives us ffprobe for the recording-verification step.
          # libvpx / libsrtp / libopus / awscli aren't reliably present
          # in the espressif/idf image's apt sources, so we lean on
          # pip + boto3 instead — the python_viewer requirements file
          # already brings boto3 along with aiortc/PyAV (which bundles
          # the codec libs).
          apt-get update && apt-get install -y --no-install-recommends ffmpeg
          pip install --no-cache-dir -r tests/docker/python_viewer/requirements.txt

      - name: Generate sdkconfig overlay with AWS creds
        if: steps.creds.outputs.skip != '1'
        env:
          ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY_ID }}
          SECRET_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        shell: bash
        run: |
          # The base overlay sdkconfig.defaults.qemu sets all the
          # CONFIG_AWS_* vars to empty strings. This .local overlay
          # comes last in the chain and overrides them with the
          # actual secret values.
          cat > examples/webrtc_classic/sdkconfig.defaults.qemu.local <<EOF
          CONFIG_AWS_ACCESS_KEY_ID="${ACCESS_KEY}"
          CONFIG_AWS_SECRET_ACCESS_KEY="${SECRET_KEY}"
          CONFIG_AWS_SESSION_TOKEN="${SESSION_TOKEN}"
          CONFIG_AWS_DEFAULT_REGION="${AWS_DEFAULT_REGION}"
          CONFIG_AWS_KVS_CHANNEL_NAME="${KVS_CHANNEL_NAME}"
          EOF

      - name: Build webrtc_classic for esp32s3 with QEMU + creds overlays
        if: steps.creds.outputs.skip != '1'
        env:
          KVS_SDK_PATH: ${{ github.workspace }}
          SDKCONFIG_DEFAULTS: "sdkconfig.defaults;sdkconfig.defaults.esp32s3;sdkconfig.defaults.qemu;sdkconfig.defaults.qemu.local"
        shell: bash
        run: |
          cd examples/webrtc_classic
          . /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py build

      - name: Run QEMU + Python viewer against same KVS channel
        if: steps.creds.outputs.skip != '1'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        shell: bash
        run: |
          # Build paths from $GITHUB_WORKSPACE inside the shell — the
          # template `${{ github.workspace }}` expands to the host
          # path on the runner, which doesn't exist inside this
          # container. The runtime $GITHUB_WORKSPACE env var is
          # auto-remapped to the container's mount.
          export OUT_PATH="$GITHUB_WORKSPACE/qemu_recording.mkv"
          export LOG_PATH="$GITHUB_WORKSPACE/python_viewer.log"
          cd examples/webrtc_classic
          . /opt/esp/idf/export.sh
          mkdir -p "$(dirname "$OUT_PATH")"
          # Start QEMU as background; serial → qemu_serial.log.
          # `-global driver=ssi_psram,property=size_mbytes,value=8`
          # caps emulated PSRAM at 8 MB (matches real S3-WROOM-1U-N16R8).
          # Without this, the qemu ssi_psram device defaults to 32 MB
          # which exceeds the S3 cache MMU's vaddr range — flash mmap
          # then has no entries available and the partition table
          # subsystem aborts on app_main entry.
          ( idf.py qemu --qemu-extra-args="-no-reboot -global driver=ssi_psram,property=size_mbytes,value=8" \
              > qemu_serial.log 2>&1 & echo $! > qemu.pid )
          # Give the firmware time to boot, get IP, sync time, and
          # reach the signaling-init retry loop.
          sleep 25
          echo "::group::Firmware boot snippet"
          tail -40 qemu_serial.log
          echo "::endgroup::"
          # Run the Python viewer; it self-terminates after TEST_DURATION_SEC.
          # `-u` for unbuffered output so tee/$LOG_PATH actually has
          # content if the script crashes (otherwise the buffer is
          # lost on abort). 2>&1 to capture stderr (tracebacks,
          # logging) into the same log file.
          python -u "${GITHUB_WORKSPACE}/tests/docker/python_viewer/viewer.py" 2>&1 | tee "$LOG_PATH" &
          VIEWER_PID=$!
          # Wait up to TEST_DURATION_SEC + grace.
          wait $VIEWER_PID || true
          # Kill QEMU.
          if [ -f qemu.pid ]; then kill -TERM $(cat qemu.pid) 2>/dev/null || true; fi
          pkill -TERM qemu-system-xtensa 2>/dev/null || true
          sleep 2
          pkill -KILL qemu-system-xtensa 2>/dev/null || true

      - name: Verify recording (ffprobe — H.264 + OPUS cross-check)
        if: steps.creds.outputs.skip != '1'
        shell: bash
        run: |
          MKV="${GITHUB_WORKSPACE}/qemu_recording.mkv"
          if [ ! -s "$MKV" ]; then
            echo "::error::qemu_recording.mkv missing or empty"
            exit 1
          fi
          ffprobe -v error -show_streams -count_packets "$MKV" > ffprobe.txt
          echo "--- ffprobe ---" ; cat ffprobe.txt ; echo "----------------"

          # Pull per-stream codec + packet count. The firmware sends
          # H.264 video + OPUS audio (CONFIG_APP_VIDEO_USE_FILE_FRAMES=y
          # loops samples/frame-*.h264 at 30 fps and matching Opus
          # frames). We assert both streams reached the viewer.
          VID_CODEC=$(awk -F= '/codec_type=video/{vid=1} vid && /codec_name=/{print $2; exit}' ffprobe.txt)
          AUD_CODEC=$(awk -F= '/codec_type=audio/{aud=1} aud && /codec_name=/{print $2; exit}' ffprobe.txt)
          VID_PACKETS=$(awk -F= '/codec_type=video/{vid=1} vid && /nb_read_packets=/{print $2; exit}' ffprobe.txt)
          AUD_PACKETS=$(awk -F= '/codec_type=audio/{aud=1} aud && /nb_read_packets=/{print $2; exit}' ffprobe.txt)

          echo "video codec=${VID_CODEC:-none} packets=${VID_PACKETS:-0}"
          echo "audio codec=${AUD_CODEC:-none} packets=${AUD_PACKETS:-0}"

          ok=1
          [ "$VID_CODEC" = "h264" ] || { echo "::error::video codec is '${VID_CODEC:-none}', expected h264"; ok=0; }
          [ "$AUD_CODEC" = "opus" ] || { echo "::error::audio codec is '${AUD_CODEC:-none}', expected opus"; ok=0; }

          # Lower threshold (≥30 packets each) — accounts for slow
          # ICE/DTLS handshake in CI. Real soak runs see hundreds.
          [ "${VID_PACKETS:-0}" -ge 30 ] || { echo "::error::video packets ${VID_PACKETS:-0} < 30"; ok=0; }
          [ "${AUD_PACKETS:-0}" -ge 30 ] || { echo "::error::audio packets ${AUD_PACKETS:-0} < 30"; ok=0; }

          [ "$ok" = "1" ] || exit 1
          echo "PASS — H.264 + OPUS round-trip verified end-to-end through QEMU."

      - name: Delete KVS channel (inline boto3)
        if: always() && steps.creds.outputs.skip != '1'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          AWS_SESSION_TOKEN: ${{ secrets.AWS_SESSION_TOKEN }}
        shell: bash
        run: |
          # awscli isn't in the espressif/idf image's apt sources, so
          # we use boto3 (already pip-installed via python_viewer's
          # requirements.txt) to clean up. Source IDF env so the
          # right python (with boto3) is on $PATH.
          . /opt/esp/idf/export.sh
          python <<'PY'
          import os, boto3
          from botocore.exceptions import ClientError
          ch = os.environ["KVS_CHANNEL_NAME"]
          kvs = boto3.client("kinesisvideo", region_name=os.environ["AWS_DEFAULT_REGION"])
          try:
              info = kvs.describe_signaling_channel(ChannelName=ch)["ChannelInfo"]
              kvs.delete_signaling_channel(ChannelARN=info["ChannelARN"],
                                           CurrentVersion=info["Version"])
              print(f"deleted {ch}")
          except ClientError as e:
              if e.response["Error"]["Code"] == "ResourceNotFoundException":
                  print(f"{ch} already gone")
              else:
                  print(f"delete error (non-fatal): {e}")
          PY

      - name: Upload QEMU + viewer artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-kvs-test-${{ github.run_id }}
          path: |
            examples/webrtc_classic/qemu_serial.log
            python_viewer.log
            qemu_recording.mkv
            ffprobe.txt
          retention-days: 7
