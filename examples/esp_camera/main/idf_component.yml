## IDF Component Manager Manifest File
dependencies:
  # local components
  espressif/esp_hosted:
    override_path: ${KVS_SDK_PATH}/components/esp_hosted
    version: '*'
    rules:
    - if: target in [esp32p4]

  espressif/esp_wifi_remote:
    override_path: ${KVS_SDK_PATH}/components/esp_wifi_remote
    version: '*'
    rules:
    - if: target in [esp32p4]

  esp_webrtc_utils:
    path: ${KVS_SDK_PATH}/components/esp_webrtc_utils
    version: '*'

  kvs_webrtc:
    path: ${KVS_SDK_PATH}/components/kvs_webrtc
    version: '*'


  app_webrtc:
    path: ${KVS_SDK_PATH}/components/app_webrtc
    version: '*'

  media_stream:
    path: ${KVS_SDK_PATH}/components/media_stream
    version: '*'

  apprtc_signaling:
    path: ../components/apprtc_signaling
    version: '*'

  app_common:
    path: ${KVS_SDK_PATH}/examples/app_common
    version: '*'
