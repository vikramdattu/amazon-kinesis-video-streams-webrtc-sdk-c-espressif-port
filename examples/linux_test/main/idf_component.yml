## IDF Component Manager Manifest File
## Linux integration test — pulls the SDK components needed for WebRTC master,
## minus media_stream/network_coprocessor (those are ESP-only).
dependencies:
  esp_webrtc_utils:
    path: ${KVS_SDK_PATH}/components/esp_webrtc_utils
    version: "*"

  kvs_webrtc:
    path: ${KVS_SDK_PATH}/components/kvs_webrtc
    version: "*"

  app_webrtc:
    path: ${KVS_SDK_PATH}/components/app_webrtc
    version: "*"

  kvs_signaling:
    path: ${KVS_SDK_PATH}/components/kvs_signaling
    version: "*"
